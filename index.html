<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pour Loana</title>
<meta name="theme-color" content="#f6e3df">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Montserrat:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#b08a3e; --gold-light:#e3c987;
  --gold-grad:linear-gradient(135deg,#a8802f 0%,#e8d08e 45%,#b08a3e 100%);
  --blush:#f6e3df; --blush-deep:#ecc9c2; --ink:#5e403b; --paper:#fffaf8;
  --serif:'Cormorant Garamond','Playfair Display',Georgia,'Times New Roman',serif;
  --sans:'Montserrat','Helvetica Neue',Arial,sans-serif;
  --P:min(440px,calc((100vw - 64px) / 2));
  --H:800px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{
  font-family:var(--serif);color:var(--ink);
  background:radial-gradient(circle at 20% 0%,#fbeeea 0%,var(--blush) 45%,var(--blush-deep) 100%) fixed;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
.sans{font-family:var(--sans)}
.gold-text{
  background-image:var(--gold-grad);-webkit-background-clip:text;background-clip:text;
  color:transparent;-webkit-text-fill-color:transparent;
}
.heart{display:inline-block;width:1em;height:1em;vertical-align:middle}
.heart svg{width:100%;height:100%;fill:var(--gold)}
.divider{display:flex;align-items:center;justify-content:center;gap:12px}
.divider i{display:block;height:1px;width:48px;background:var(--gold-grad)}
.divider b{color:var(--gold);font-size:14px;font-weight:400}

/* ---------- Envelope ---------- */
#envelope-screen{
  min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:24px;transition:opacity .5s,transform .5s;
}
#envelope-screen.leaving{opacity:0;transform:translateY(30px)}
.env-kicker{font-family:var(--sans);font-size:12px;letter-spacing:.4em;text-transform:uppercase;color:var(--gold)}
.env-to{font-size:52px;font-style:italic;margin:10px 0 36px}
.env{position:relative;width:320px;height:220px;perspective:900px;cursor:pointer;outline:none;-webkit-tap-highlight-color:transparent}
.env.opening{cursor:default}
.env-back{position:absolute;inset:0;border-radius:10px;background:var(--blush-deep);border:1px solid var(--gold-light);box-shadow:0 24px 50px rgba(176,138,62,.3)}
.letter{
  position:absolute;left:18px;right:18px;top:12px;height:190px;border-radius:6px;background:var(--paper);
  border:1px solid var(--gold-light);z-index:2;display:flex;align-items:center;justify-content:center;
  font-size:28px;transition:transform .7s ease-in-out .5s;
}
.env.opening .letter{transform:translateY(-90px)}
.pocket{position:absolute;inset:0;z-index:3;filter:drop-shadow(0 -2px 4px rgba(176,138,62,.25));pointer-events:none}
.pocket div{width:100%;height:100%;border-radius:10px;background:linear-gradient(160deg,#f9e9e5 0%,#f1d4cd 100%);
  clip-path:polygon(0 0,50% 58%,100% 0,100% 100%,0 100%)}
.flap{
  position:absolute;left:0;top:0;width:100%;height:58%;transform-origin:top center;z-index:4;
  filter:drop-shadow(0 4px 5px rgba(176,138,62,.3));transition:transform .7s ease-in-out,z-index 0s linear .35s;
}
.flap div{width:100%;height:100%;background:linear-gradient(180deg,#f3d6cf 0%,#ecc9c2 100%);
  clip-path:polygon(0 0,100% 0,50% 100%);border-radius:10px 10px 0 0}
.env.opening .flap{transform:rotateX(180deg);z-index:1}
.seal{
  position:absolute;left:50%;top:58%;margin:-26px 0 0 -26px;width:52px;height:52px;border-radius:50%;
  background:var(--gold-grad);box-shadow:0 6px 14px rgba(120,90,30,.4);z-index:5;
  display:flex;align-items:center;justify-content:center;font-size:22px;animation:pulse 1.8s ease-in-out infinite;
}
.seal .heart svg{fill:#fff}
.env.opening .seal{animation:none;opacity:0;transform:scale(.6);transition:opacity .3s,transform .3s}
.env-hint{font-family:var(--sans);font-size:12px;letter-spacing:.3em;text-transform:uppercase;margin-top:44px;opacity:.8;transition:opacity .3s}
.env-hint.hide{opacity:0}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
@keyframes blink{0%,100%{opacity:.4}50%{opacity:.9}}

/* ---------- Card screen ---------- */
#card-screen{display:none;opacity:0;transition:opacity .6s,transform .6s;transform:translateY(20px)}
#card-screen.show{opacity:1;transform:none}
.paper{background:var(--paper);border:1px solid var(--gold-light);box-shadow:0 18px 40px rgba(176,138,62,.22)}
.cover-bg{background:linear-gradient(160deg,#fbeeea 0%,var(--blush-deep) 100%)}

/* cover content */
.cover-in{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 32px;position:relative}
.cover-in:before{content:"";position:absolute;inset:12px;border:1px solid var(--gold);border-radius:8px;pointer-events:none}
.cover-in h1{font-size:50px;line-height:1.08;font-style:italic;font-weight:500}
.cover-in .beat{margin-top:16px;font-size:32px;animation:beat 1.6s ease-in-out infinite}
.cover-in .div{margin-top:22px}
.cover-in .std{font-family:var(--sans);font-size:12px;letter-spacing:.4em;text-transform:uppercase;color:var(--gold);margin-top:22px}
.cover-in .fete{font-size:28px;font-style:italic;margin-top:8px}
.cover-in .tap{font-family:var(--sans);font-size:11px;letter-spacing:.3em;text-transform:uppercase;margin-top:40px;animation:blink 2s infinite;transition:opacity .3s}
.open .cover-in .tap{animation:none;opacity:0}

/* left content */
.left{height:100%;display:flex;flex-direction:column;align-items:center;text-align:center;padding:30px 24px;gap:18px}
.arch{padding:5px;border-radius:999px 999px 20px 20px;background:var(--gold-grad);box-shadow:0 14px 30px rgba(176,138,62,.28)}
.arch .in{border-radius:999px 999px 16px 16px;overflow:hidden;aspect-ratio:2/3;background:var(--blush-deep);border:3px solid var(--blush)}
.arch img{width:100%;height:100%;object-fit:cover;object-position:center 35%;display:block}
.date .lbl{font-family:var(--sans);font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);margin-top:8px}
.date .big{font-size:44px;line-height:1.05;font-weight:500;margin:4px 0}
.date .hour{font-size:20px;font-style:italic}
.date .cal{font-size:22px;color:var(--gold)}
.count{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.cb{min-width:56px;padding:9px 8px;border-radius:12px;background:rgba(255,255,255,.6);border:1px solid var(--gold-light);display:flex;flex-direction:column;align-items:center}
.cb span{font-size:28px;line-height:1;font-weight:600;color:var(--gold)}
.cb em{font-style:normal;font-family:var(--sans);font-size:9px;letter-spacing:.16em;text-transform:uppercase;margin-top:5px}
.place{width:100%;padding:14px 12px;border-radius:16px;background:var(--gold-grad);color:#fff}
.place .t{font-family:var(--sans);font-size:11px;letter-spacing:.28em;text-transform:uppercase}
.place .v{font-size:22px;font-style:italic;margin-top:4px}
.place .s{font-family:var(--sans);font-size:10px;letter-spacing:.12em;margin-top:6px}

/* right content */
.right{padding:34px 30px;text-align:center}
.right .belle{font-size:32px;font-style:italic;color:var(--gold);font-weight:600;margin-top:20px}
.right p.t{line-height:1.5;margin-top:16px}
.right p.close{font-style:italic;color:var(--gold);font-weight:600;line-height:1.45;margin-top:16px}
.right .sign{margin-top:22px}
.right .sign .a{font-size:20px;margin-top:8px}
.right .sign .n{font-size:42px;font-style:italic;font-weight:500;color:var(--gold);line-height:1.15}

/* wide layout */
.wide-only{display:none}
.narrow-only{display:block}
.nbook{position:relative;width:min(400px,calc(100vw - 32px));margin:28px auto 48px;perspective:1800px}
.npaper{border-radius:10px;height:560px;overflow:hidden}
.nbook.open .npaper{height:auto}
.nbook .left{height:auto;padding-bottom:26px}
.nbook .right p.t{font-size:19px}
.nbook .right p.close{font-size:21px}
.ncover{position:absolute;left:0;top:0;width:100%;height:560px;border-radius:10px;transform-origin:left center;
  cursor:pointer;z-index:2;transition:transform 1.1s ease-in-out,opacity 1.1s ease-in-out;outline:none}
.nbook.open .ncover{transform:rotateY(-115deg);opacity:0;pointer-events:none}
.sep{border-top:1px dashed var(--gold-light);margin:0 24px}

@media (min-width:780px){
  .wide-only{display:flex}
  .narrow-only{display:none}
  .book-wrap{justify-content:center;padding:40px 0 56px;overflow:hidden}
  .book{position:relative;width:calc(var(--P) * 2);height:var(--H);perspective:2400px;
    transform:translateX(calc(var(--P) / -2));transition:transform 1.2s ease-in-out}
  .book.open{transform:none}
  .page-right{position:absolute;left:var(--P);top:0;width:var(--P);height:var(--H);overflow-y:auto;
    border-radius:0 10px 10px 0;box-shadow:0 18px 40px rgba(176,138,62,.22),inset 22px 0 26px -18px rgba(176,138,62,.35)}
  .page-right .right p.t{font-size:16.5px}
  .page-right .right p.close{font-size:18.5px}
  .cover3d{position:absolute;left:var(--P);top:0;width:var(--P);height:var(--H);transform-origin:left center;
    transform-style:preserve-3d;z-index:2;cursor:pointer;transition:transform 1.2s ease-in-out;outline:none}
  .book.open .cover3d{transform:rotateY(-180deg);cursor:default}
  .face{position:absolute;inset:0;-webkit-backface-visibility:hidden;backface-visibility:hidden}
  .face.front{border-radius:0 10px 10px 0}
  .face.back{transform:rotateY(180deg);border-radius:10px 0 0 10px;overflow-y:auto;
    box-shadow:0 18px 40px rgba(176,138,62,.22),inset -22px 0 26px -18px rgba(176,138,62,.35)}
  .face.back .arch{width:min(240px,calc(var(--P) - 80px))}
  .face.back .left{height:auto;min-height:100%}
}
@media (max-width:779px){
  .nbook .arch{width:min(280px,calc(100vw - 92px))}
  .cover-in h1{font-size:44px}
  .env-to{font-size:44px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>

<div id="envelope-screen">
  <p class="env-kicker">Une surprise pour toi</p>
  <p class="env-to">Pour Loana</p>
  <div class="env" id="env" role="button" tabindex="0" aria-label="Ouvrir le faire-part">
    <div class="env-back"></div>
    <div class="letter"><span class="heart" data-heart></span></div>
    <div class="pocket"><div></div></div>
    <div class="flap"><div></div></div>
    <div class="seal"><span class="heart" data-heart></span></div>
  </div>
  <p class="env-hint" id="env-hint">Touche pour ouvrir</p>
</div>

<div id="card-screen">
  <!-- wide: two pages -->
  <div class="book-wrap wide-only">
    <div class="book" id="book">
      <div class="page-right paper" data-right></div>
      <div class="cover3d" id="cover3d" role="button" tabindex="0" aria-label="Ouvrir le faire-part">
        <div class="face front paper cover-bg" data-cover></div>
        <div class="face back paper" data-left></div>
      </div>
    </div>
  </div>
  <!-- narrow: single column -->
  <div class="nbook narrow-only" id="nbook">
    <div class="npaper paper"><div data-left></div><div class="sep"></div><div data-right></div></div>
    <div class="ncover paper cover-bg" id="ncover" role="button" tabindex="0" aria-label="Ouvrir le faire-part" data-cover></div>
  </div>
</div>

var HEART = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.1C.9 8.6 2.7 5 6.2 5c2 0 3.4 1.1 4.3 2.4h3C14.4 6.1 15.8 5 17.8 5c3.5 0 5.3 3.6 3.8 6.9C19.5 16.4 12 21 12 21z"/></svg>';
var HEART_SM = '<span class="heart">' + HEART + '</span>';

var COVER = '<div class="cover-in">' +
  '<h1 class="gold-text">Joyeux anniversaire ma belle</h1>' +
  '<div class="beat">' + HEART_SM + '</div>' +
  '<div class="div divider"><i></i><b>&#10022;</b><i></i></div>' +
  '<p class="std">Save the date</p>' +
  '<p class="fete">on va les fêter tes 29 ans</p>' +
  '<p class="tap">Touche pour ouvrir</p></div>';

var LEFT = '<div class="left">' +
  '<div class="arch"><div class="in"><img src="' + PHOTO + '" alt="Laura et Loana"></div></div>' +
  '<div class="date"><div class="cal">&#10084;&#xFE0E;</div><p class="lbl">Samedi</p><p class="big">7 novembre</p><p class="hour">à partir de 19h</p></div>' +
  '<div class="count">' +
    '<div class="cb"><span class="cd-d">00</span><em>jours</em></div>' +
    '<div class="cb"><span class="cd-h">00</span><em>heures</em></div>' +
    '<div class="cb"><span class="cd-m">00</span><em>min</em></div>' +
    '<div class="cb"><span class="cd-s">00</span><em>sec</em></div>' +
  '</div>' +
  '<div class="place"><p class="t">Lieu</p><p class="v">Je te le dévoile très bientôt</p>' +
  '<p class="s">RÉSERVE TA SOIRÉE, LE RESTE EST UNE SURPRISE</p></div></div>';

var RIGHT = '<div class="right">' +
  '<div class="divider"><i></i><b>&#10022;</b><i></i></div>' +
  '<p class="belle">Ma belle,</p>' +
  '<p class="t">Je tiens à te souhaiter un merveilleux anniversaire ! Ton dernier anniversaire dans la vingtaine, ça se fête ! Donc même si tu as réussi à fuir pour ta date d\'anniv, compte sur moi pour t\'organiser quelque chose à ton retour !</p>' +
  '<p class="t">J\'en profite pour te déclarer ma flamme. Ça fait 3 ans qu\'on se connaît et j\'ai pourtant l\'impression de t\'avoir toujours connue. En seulement 3 ans, on a partagé tant de choses : nos activités chaque week-end, nos voyages de partout et toutes nos histoires qu\'on se raconte sans jamais se lasser. Tu m\'as apporté énormément, et sans toi, je ne serais pas la même aujourd\'hui.</p>' +
  '<p class="t">Bientôt, tu t\'envoles vivre aux États-Unis. Tu vas énormément me manquer, mais je suis tellement fière de ton évolution de queen. Je te souhaite vraiment le meilleur pour tes 29 ans et cette nouvelle vie qui commence aussi.</p>' +
  '<p class="close">Loin des yeux, mais toujours près de mon cœur.<br>Même à distance, on va continuer de la vivre, notre putain de vie !</p>' +
  '<div class="sign"><span style="font-size:18px">' + HEART_SM + '</span><p class="a">Avec tout mon amour,</p><p class="n">Laura</p></div></div>';

function fill(sel, html){
  document.querySelectorAll(sel).forEach(function(el){ el.innerHTML = html; });
}
fill('[data-cover]', COVER);
fill('[data-left]', LEFT);
fill('[data-right]', RIGHT);
document.querySelectorAll('[data-heart]').forEach(function(el){ el.innerHTML = HEART; });

/* countdown */
var TARGET = new Date(2026, 10, 7, 19, 0, 0).getTime();
function pad(n){ return String(n).padStart(2, '0'); }
function tick(){
  var d = Math.max(0, TARGET - Date.now());
  var vals = {
    '.cd-d': Math.floor(d / 86400000),
    '.cd-h': Math.floor(d / 3600000 % 24),
    '.cd-m': Math.floor(d / 60000 % 60),
    '.cd-s': Math.floor(d / 1000 % 60)
  };
  Object.keys(vals).forEach(function(k){
    document.querySelectorAll(k).forEach(function(el){ el.textContent = pad(vals[k]); });
  });
}
tick(); setInterval(tick, 1000);

/* open the folded card */
function openCard(){
  var b = document.getElementById('book');
  var n = document.getElementById('nbook');
  if (b) b.classList.add('open');
  if (n) n.classList.add('open');
}
['cover3d', 'ncover'].forEach(function(id){
  var el = document.getElementById(id);
  el.addEventListener('click', openCard);
  el.addEventListener('keydown', function(e){
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openCard(); }
  });
});
document.getElementById('book').classList.add('book-init');

/* envelope */
var started = false;
function openEnvelope(){
  if (started) return;
  started = true;
  document.getElementById('env').classList.add('opening');
  document.getElementById('env-hint').classList.add('hide');
  setTimeout(function(){
    document.getElementById('envelope-screen').classList.add('leaving');
  }, 1300);
  setTimeout(function(){
    document.getElementById('envelope-screen').style.display = 'none';
    var cs = document.getElementById('card-screen');
    cs.style.display = 'block';
    window.scrollTo(0, 0);
    requestAnimationFrame(function(){ requestAnimationFrame(function(){ cs.classList.add('show'); }); });
  }, 1850);
}
var env = document.getElementById('env');
env.addEventListener('click', openEnvelope);
env.addEventListener('keydown', function(e){
  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openEnvelope(); }
});
